[package]
name = "selene-desktop"
version = "0.3.0"
description = "Selene — Technical Documentation & Live Code Canvas"
authors = ["Selene Team"]
edition = "2021"

[lib]
name = "selene_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
