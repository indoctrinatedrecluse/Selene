name: Selene Release Suite

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v0.3.0)'
        required: true
        default: 'v0.3.0'

permissions:
  contents: write

jobs:
  test-and-verify:
    name: Quality & Sanity Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Run TypeScript Type-Check
        run: npm run type-check

      - name: Run ESLint Analysis
        run: npm run lint

      - name: Compile Next.js Production Build
        run: npm run build

  build-desktop-tauri:
    name: Build Desktop Artifacts (${{ matrix.platform }})
    needs: test-and-verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''
          - platform: 'macos-latest'
            args: ''
          - platform: 'ubuntu-22.04'
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux Dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libjavascriptcoregtk-4.1-dev

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Next.js Production Assets
        run: npm run build

      - name: Build Tauri Desktop Package
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Selene ${{ github.ref_name }} — Titan Edition'
          releaseBody: |
            ## 🌙 Selene ${{ github.ref_name }} — Titan Edition
            
            Welcome to the official native desktop release of **Selene — The Hypermodern Technical Document & Code Canvas**.
            
            ### 📦 Included Desktop Distributions:
            - **Windows**: `.msi` Installer & Portable `.exe`
            - **macOS**: Universal `.dmg` Disk Image (Apple Silicon + Intel)
            - **Linux**: `.AppImage` & Debian `.deb` Packages
            
            See [CHANGELOG.md](https://github.com/indoctrinatedrecluse/Selene/blob/main/CHANGELOG.md) for full release details.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
